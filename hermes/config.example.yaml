# Merged into the Hermes "continuum" profile by: python scripts/setup_hermes.py
# `model` is filled in from NEBIUS_MODEL / NEBIUS_BASE_URL in .env.
# `timezone` is set from TIMEZONE in .env, so Hermes' clock and the briefing schedule match Continuum's.

model:
  provider: nebius
  default: nvidia/nemotron-3-super-120b-a12b
  base_url: https://api.tokenfactory.nebius.com/v1/

mcp_servers:
  continuum:
    url: "http://127.0.0.1:8000/mcp/"
    tools:
      include: [remember, list_open_loops, needs_attention, list_goals, inspect_loop, resolve_loop, snooze_loop,
                list_pending_actions, approve_action, reject_action, web_lookup, propose_loop_update, watch_loop,
                set_person_email, propose_calendar_event, propose_gmail_draft, investigate]
      prompts: false
      resources: false

# Show our tools to the model directly. Hermes' default "tool search" hides MCP tools behind
# tool_search/tool_describe/tool_call, which cost ~3 extra model round-trips per reply.
tools:
  tool_search:
    enabled: "off"

# Continuum's tools only, on every platform this profile serves. No terminal, files, web or browser.
# A platform without an entry gets Hermes' full default toolset (terminal included) and no Continuum tools.
platform_toolsets:
  api_server: [continuum]
  cli: [continuum]
  telegram: [continuum]
  cron: [continuum]  # the daily briefing job

# A delivered briefing joins the Telegram chat, so a reply like "snooze the second one" has context.
cron:
  mirror_delivery: true

# Own gateway + API server for this profile, so your default Hermes profile stays untouched.
# Hermes marks this as a temporary shim. If a Hermes update removes it, switch to the shared
# host gateway: enable the API server on the default profile and set
# HERMES_API_URL=http://127.0.0.1:8642/p/continuum/v1
gateway:
  standalone: true

# Continuum is the memory. Hermes' own memory stays off, so there is one source of truth.
memory:
  memory_enabled: false
  user_profile_enabled: false
