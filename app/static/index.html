<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continuum</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='8' fill='none' stroke='%231d6b5a' stroke-width='3' stroke-dasharray='40 10'/></svg>">
<style>
:root {
  --bg: oklch(0.975 0.004 170);
  --panel: oklch(1 0 0);
  --sunk: oklch(0.955 0.006 170);
  --line: oklch(0.9 0.008 170);
  --ink: oklch(0.24 0.015 200);
  --muted: oklch(0.47 0.015 200);
  --accent: oklch(0.47 0.09 170);
  --accent-ink: oklch(0.99 0 0);
  --accent-soft: oklch(0.94 0.035 170);
  --waiting: oklch(0.55 0.11 70);
  --danger: oklch(0.52 0.17 27);
  --danger-soft: oklch(0.95 0.03 27);
  --fresh: oklch(0.92 0.08 95);
  --radius: 10px;
  --small: 0.8125rem; --body: 0.9375rem; --title: 1.15rem;
  --shadow: 0 1px 2px oklch(0.2 0.02 200 / 0.06), 0 4px 16px oklch(0.2 0.02 200 / 0.05);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(0.19 0.01 200);
    --panel: oklch(0.23 0.012 200);
    --sunk: oklch(0.205 0.01 200);
    --line: oklch(0.32 0.012 200);
    --ink: oklch(0.93 0.008 170);
    --muted: oklch(0.72 0.012 190);
    --accent: oklch(0.72 0.1 170);
    --accent-ink: oklch(0.17 0.02 180);
    --accent-soft: oklch(0.3 0.04 170);
    --waiting: oklch(0.78 0.11 75);
    --danger: oklch(0.72 0.15 27);
    --danger-soft: oklch(0.3 0.05 27);
    --fresh: oklch(0.4 0.07 95);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 4px 16px oklch(0 0 0 / 0.2);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; max-width: 1240px; margin: 0 auto; padding: 0 20px 20px; }
header { display: flex; align-items: baseline; gap: 12px; padding: 18px 2px 16px; }
header h1 { margin: 0; font-size: var(--title); font-weight: 650; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
header h1 svg { color: var(--accent); width: 20px; height: 20px; stroke-width: 2.4; }
header p { margin: 0; color: var(--muted); font-size: var(--body); }
main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; min-height: 0; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; }
.col > h2 { margin: 0; padding: 14px 18px 12px; font-size: var(--body); font-weight: 620; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.col > h2 .spacer { flex: 1; }
.col > h2 .count { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }

/* Needs attention */
.attention { margin-bottom: 20px; }
.attention ul { list-style: none; margin: 0; padding: 6px 10px 10px; }
.attention li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; }
.attention li:hover { background: var(--sunk); }
.attention .late { color: var(--danger); font-weight: 600; }
.row-actions { display: flex; gap: 6px; }
.btn.small { min-height: 30px; padding: 0 10px; font-size: var(--small); }
details.menu { position: relative; }
details.menu summary { list-style: none; }
details.menu summary::-webkit-details-marker { display: none; }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 10; min-width: 200px; display: flex; flex-direction: column; gap: 2px;
  padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
}
.actions .menu-pop { left: 0; right: auto; }
.menu-pop button { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: var(--body); }
.menu-pop button:hover { background: var(--sunk); }
.menu-pop label { display: flex; flex-direction: column; gap: 4px; padding: 7px 10px; font-size: var(--small); color: var(--muted); }
.menu-pop input { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.msg .copy { display: flex; margin-top: 8px; }

/* Chat */
#messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--sunk); border-bottom-left-radius: 4px; }
.msg.error { align-self: stretch; max-width: none; background: var(--danger-soft); color: var(--ink); border-radius: 8px; font-size: var(--body); }
.msg.error strong { color: var(--danger); }
.typing { align-self: flex-start; display: flex; gap: 4px; padding: 13px 14px; background: var(--sunk); border-radius: 14px; border-bottom-left-radius: 4px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
.typing span:nth-child(2) { animation-delay: 0.15s; } .typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.hello { margin: auto 0; color: var(--muted); font-size: var(--body); text-align: center; padding: 0 12px; }
.hello p { margin: 0 0 4px; }
form.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
form.composer textarea {
  flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); line-height: 1.4;
}
form.composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; min-height: 36px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: var(--body); font-weight: 550;
  transition: background 150ms, border-color 150ms;
}
.btn:hover { background: var(--sunk); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover:not(:disabled) { background: color-mix(in oklch, var(--accent), black 12%); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); border-color: transparent; }
form.composer .btn { min-height: 44px; }

/* Loops */
.toggle { font-size: var(--small); font-weight: 450; color: var(--muted); display: flex; align-items: center; gap: 6px; cursor: pointer; }
.toggle input { accent-color: var(--accent); margin: 0; }
#loops { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 10px 16px; }
.group { padding-top: 10px; }
.group h3 { margin: 0; padding: 6px 8px; font-size: var(--small); font-weight: 620; color: var(--muted); display: flex; align-items: baseline; gap: 8px; }
.group h3 .count { font-weight: 500; font-variant-numeric: tabular-nums; }
.group h3 .end { margin-left: auto; font-weight: 500; white-space: nowrap; }
.group h3 button.end { border: 0; background: none; padding: 2px 4px; border-radius: 4px; color: var(--accent); cursor: pointer; font-size: var(--small); }
.group h3 button.end:hover { background: var(--accent-soft); }
.group h3 .done { color: var(--accent); }
.group.nogoal h3 { font-weight: 500; }
details.loop { border-radius: 8px; transition: background 150ms; }
details.loop[open] { background: var(--sunk); }
details.loop.fresh { animation: fresh 2.4s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes fresh { 0%, 25% { background: var(--fresh); } 100% { background: transparent; } }
details.loop summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  padding: 9px 8px; border-radius: 8px;
}
details.loop summary::-webkit-details-marker { display: none; }
details.loop summary:hover { background: var(--sunk); }
.kind { color: var(--muted); display: flex; }
.kind.waiting { color: var(--waiting); }
.loop .title { min-width: 0; }
.loop .title b { font-weight: 550; }
.loop .title small { display: block; color: var(--muted); font-size: var(--small); }
.due { font-size: var(--small); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.due.overdue { color: var(--danger); font-weight: 600; }
.due.soon { color: var(--ink); font-weight: 550; }
details.loop.resolved .title b { text-decoration: line-through; color: var(--muted); font-weight: 450; }
details.loop.resolved .kind { color: var(--accent); }

.detail { padding: 2px 12px 14px 36px; }
.detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 4px 0 14px; font-size: var(--body); }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.why { margin: 0 0 14px; }
.why h4 { margin: 0 0 6px; font-size: var(--small); font-weight: 620; }
.why blockquote { margin: 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: var(--body); white-space: pre-wrap; }
.why figcaption { margin-top: 6px; font-size: var(--small); color: var(--muted); }
.actions { display: flex; gap: 8px; }
.skeleton { height: 14px; border-radius: 4px; background: var(--line); margin: 8px 0; animation: blink 1.2s infinite; }

.empty { padding: 32px 18px; text-align: center; color: var(--muted); }
.empty h3 { margin: 0 0 6px; color: var(--ink); font-size: var(--title); font-weight: 600; }
.empty p { margin: 0 auto 14px; max-width: 46ch; font-size: var(--body); }
.empty blockquote { margin: 0 auto 14px; max-width: 52ch; padding: 12px 14px; text-align: left; color: var(--ink); background: var(--sunk); border-radius: 8px; font-size: var(--body); }

@media (max-width: 860px) {
  .app { height: auto; padding: 0 12px 12px; }
  main { grid-template-columns: 1fr; }
  #messages { min-height: 280px; max-height: 55vh; }
  #loops { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-loop" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="40 10"/></symbol>
  <symbol id="i-task" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3.5"/></symbol>
  <symbol id="i-waiting" viewBox="0 0 24 24"><path d="M7 3.5h10M7 20.5h10M8 3.5c0 5 8 4.5 8 8.5s-8 3.5-8 8.5M16 3.5c0 5-8 4.5-8 8.5s8 3.5 8 8.5"/></symbol>
  <symbol id="i-commitment" viewBox="0 0 24 24"><path d="M4 12h12M12 6l6 6-6 6"/></symbol>
  <symbol id="i-done" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
</svg>

<div class="app">
  <header>
    <h1><svg class="i"><use href="#i-loop"/></svg>Continuum</h1>
    <p>Remembers what's still unfinished.</p>
  </header>
  <section class="col attention" id="attention" aria-labelledby="attention-h" hidden>
    <h2><span id="attention-h">Needs attention</span> <span class="count" id="attention-count"></span></h2>
    <ul id="attention-list"></ul>
  </section>
  <main>
    <section class="col" aria-labelledby="chat-h">
      <h2 id="chat-h">Talk to Continuum</h2>
      <div id="messages" aria-live="polite">
        <div class="hello" id="hello">
          <p>Tell me what you're working on, what you promised, or what you're waiting for.</p>
          <p>Ask "What am I waiting on?" any time.</p>
        </div>
      </div>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Type a message…" aria-label="Message" required></textarea>
        <button class="btn primary" id="send" type="submit"><svg class="i"><use href="#i-send"/></svg>Send</button>
      </form>
    </section>

    <section class="col" aria-labelledby="loops-h">
      <h2><span id="loops-h">Open loops</span> <span class="spacer"></span>
        <label class="toggle"><input type="checkbox" id="show-snoozed"> Show snoozed</label>
        <label class="toggle"><input type="checkbox" id="show-resolved"> Show resolved</label>
      </h2>
      <div id="loops" aria-busy="true">
        <div class="skeleton" style="width:40%"></div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div>
      </div>
    </section>
  </main>
</div>

<script>
const EXAMPLE = "I'm applying for an NVIDIA internship. I submitted my application yesterday. Sarah said she'll get back to me next Friday. I also need to finish my portfolio before the interview.";
const KIND = { task: "Task", waiting: "Waiting on someone", commitment: "Your promise" };
const conversation = crypto.randomUUID();  // one Hermes conversation per page load
const $ = (id) => document.getElementById(id);
let seen = new Map();  // loop id -> updated_at, to highlight what a chat changed
let highlightNext = false;

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  el.append(...children.flat(Infinity).filter((c) => c != null && c !== false));
  return el;
}
function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "i"); svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#i-" + name);
  svg.append(use);
  return svg;
}

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.message || `Request failed (HTTP ${res.status}).`);
  return body;
}

// --- dates ---
const DAY = 86400000;
function localDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function shortDate(d) { return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
function dueInfo(iso) {
  const due = localDate(iso), today = fromToday(0);
  const days = Math.round((due - today) / DAY);
  const rel = days === 0 ? "today" : days === 1 ? "tomorrow" : days === -1 ? "1 day overdue"
    : days < 0 ? `${-days} days overdue` : `in ${days} days`;
  return { text: `${shortDate(due)} · ${rel}`, cls: days < 0 ? "overdue" : days <= 1 ? "soon" : "" };
}
function fromToday(days) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + days); return d; }
function nextMonday() { const d = fromToday(1); while (d.getDay() !== 1) d.setDate(d.getDate() + 1); return d; }
function isoDay(d) { return [d.getFullYear(), d.getMonth() + 1, d.getDate()].map((n) => String(n).padStart(2, "0")).join("-"); }
function isSnoozed(l) { return l.status === "open" && l.snoozed_until && localDate(l.snoozed_until) > fromToday(0); }

// --- needs attention ---
async function loadAttention() {
  const box = $("attention"), list = $("attention-list");
  let items;
  try {
    items = await api("/api/attention");
  } catch (e) {
    box.hidden = false;
    list.replaceChildren(h("li", {}, h("span", { class: "late" }, `Couldn't load what needs attention: ${e.message}`)));
    return;
  }
  box.hidden = !items.length;
  $("attention-count").textContent = `(${items.length})`;
  list.replaceChildren(...items.map(({ loop: l, reason }) =>
    h("li", { class: "loop" },
      h("span", { class: `kind ${l.kind}`, title: KIND[l.kind] }, icon(l.kind)),
      h("span", { class: "title" }, h("b", {}, l.title),
        h("small", {}, l.goal_title && `${l.goal_title} · `, h("span", { class: reason.startsWith("overdue") ? "late" : null }, reason))),
      h("span", { class: "row-actions" },
        h("button", { class: "btn small", type: "button", onclick: () => draft(l) }, "Draft"),
        snoozeMenu(l.id, true)))));
}

function snoozeMenu(id, small = false) {
  const snooze = (d) => act(`/api/loops/${id}/snooze`, "POST", { until: isoDay(d) });
  const picks = [["Tomorrow", fromToday(1)], ["In 3 days", fromToday(3)], ["Next Monday", nextMonday()]];
  return h("details", { class: "menu" },
    h("summary", { class: small ? "btn small" : "btn" }, "Snooze"),
    h("div", { class: "menu-pop" },
      picks.map(([label, d]) => h("button", { type: "button", onclick: () => snooze(d) }, `${label} · ${shortDate(d)}`)),
      h("label", {}, "Pick a date",
        h("input", { type: "date", min: isoDay(fromToday(1)), onchange: (e) => e.target.value && snooze(localDate(e.target.value)) }))));
}
document.addEventListener("click", (e) => {  // close an open Snooze menu when clicking elsewhere
  for (const menu of document.querySelectorAll("details.menu[open]")) if (!menu.contains(e.target)) menu.open = false;
});

function draft(l) {
  send(`Draft a follow-up for loop ${l.id}`, `Draft a follow-up: ${l.title}`, true);
}

function refresh() { return Promise.all([loadLoops(), loadAttention()]); }

// --- loops ---
async function loadLoops() {
  const status = $("show-resolved").checked ? "all" : "open";
  const box = $("loops");
  let loops;
  try {
    loops = await api(`/api/loops?status=${status}&include_snoozed=${$("show-snoozed").checked}`);
  } catch (e) {
    box.replaceChildren(h("div", { class: "empty" }, h("h3", {}, "Couldn't load your loops"), h("p", {}, e.message)));
    return;
  }
  const fresh = highlightNext ? loops.filter((l) => seen.get(l.id) !== l.updated_at).map((l) => l.id) : [];
  highlightNext = false;
  seen = new Map(loops.map((l) => [l.id, l.updated_at]));
  const openIds = new Set([...box.querySelectorAll("details[open]")].map((d) => d.dataset.id));
  box.removeAttribute("aria-busy");

  if (!loops.length) {
    box.replaceChildren(emptyState());
    return;
  }
  const groups = new Map();  // goal id -> loops, most urgent goal first ("No goal" last)
  for (const l of loops) {
    const key = l.goal_id || "";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(l);
  }
  const keys = [...groups.keys()].sort((a, b) => (a === "") - (b === ""));
  box.replaceChildren(...keys.map((key) => {
    const items = groups.get(key).sort((a, b) => (a.status === "resolved") - (b.status === "resolved"));
    const open = items.filter((l) => l.status === "open").length;
    const { goal_title: title, goal_status: goalStatus } = items[0];
    return h("div", { class: "group" + (key ? "" : " nogoal") },
      h("h3", {}, key ? title : "No goal", h("span", { class: "count" }, `(${open})`),
        key && (goalStatus === "done"
          ? h("span", { class: "end done" }, "Goal done")
          : h("button", { class: "end", type: "button", onclick: () => completeGoal(key, title, open) }, "Mark goal done"))),
      items.map((l) => loopRow(l, fresh.includes(l.id), openIds.has(l.id))));
  }));
}

function completeGoal(id, title, open) {
  const loops = open === 1 ? "its open loop" : `its ${open} open loops`;
  const note = open ? ` This resolves ${loops}. Reopen any of them to undo.` : "";
  if (confirm(`Mark "${title}" done?${note}`)) act(`/api/goals/${id}/complete`, "POST");
}

function emptyState() {
  return h("div", { class: "empty" },
    h("h3", {}, "Nothing open yet"),
    h("p", {}, "Tell Continuum about a goal, a deadline, or something someone owes you. It turns that into loops it keeps track of."),
    h("blockquote", {}, EXAMPLE),
    h("button", { class: "btn", type: "button", onclick: () => { $("input").value = EXAMPLE; autosize(); $("input").focus(); } }, "Use this example"));
}

function loopRow(l, fresh, open) {
  const resolved = l.status === "resolved";
  const due = l.due && !resolved ? dueInfo(l.due) : null;
  const sub = [
    l.waiting_on && `from ${l.waiting_on}`,
    resolved && "resolved",
    isSnoozed(l) && `snoozed until ${shortDate(localDate(l.snoozed_until))}`,
  ].filter(Boolean).join(" · ");
  const row = h("details", { class: `loop${resolved ? " resolved" : ""}${fresh ? " fresh" : ""}`, "data-id": l.id, open },
    h("summary", {},
      h("span", { class: `kind ${l.kind}`, title: resolved ? "Resolved" : KIND[l.kind] }, icon(resolved ? "done" : l.kind)),
      h("span", { class: "title" }, h("b", {}, l.title), sub && h("small", {}, sub)),
      h("span", { class: "due" + (due ? " " + due.cls : "") }, due ? due.text : "")),
    h("div", { class: "detail" }, h("div", { class: "skeleton" }), h("div", { class: "skeleton", style: "width:60%" })));
  row.addEventListener("toggle", () => { if (row.open) loadDetail(row, l.id); });
  if (open) loadDetail(row, l.id);
  return row;
}

async function loadDetail(row, id) {
  const panel = row.querySelector(".detail");
  let d;
  try { d = await api(`/api/loops/${id}`); }
  catch (e) { panel.replaceChildren(h("p", { class: "due overdue" }, e.message)); return; }
  const said = new Date(d.source.created_at);
  const fields = [
    ["Kind", KIND[d.kind]],
    ["Waiting on", d.waiting_on],
    ["Due", d.due && shortDate(localDate(d.due))],
    ["Next action", d.next_action],
    ["Summary", d.summary],
    ["Snoozed until", isSnoozed(d) && shortDate(localDate(d.snoozed_until))],
    ["Resolved", d.resolved_at && new Date(d.resolved_at).toLocaleString()],
  ].filter(([, v]) => v);
  const resolved = d.status === "resolved";
  const snooze = !resolved && (isSnoozed(d)
    ? h("button", { class: "btn", type: "button", onclick: () => act(`/api/loops/${id}/unsnooze`, "POST") }, "Unsnooze")
    : snoozeMenu(id));
  panel.replaceChildren(
    h("dl", {}, fields.map(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])),
    h("figure", { class: "why" },
      h("h4", {}, "Why Continuum knows this"),
      h("blockquote", {}, d.source.text),
      h("figcaption", {}, `You said this ${said.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}`)),
    h("div", { class: "actions" },
      h("button", { class: "btn primary", type: "button", onclick: () => act(`/api/loops/${id}/${resolved ? "reopen" : "resolve"}`, "POST") }, resolved ? "Reopen" : "Resolve"),
      snooze,
      h("button", { class: "btn danger", type: "button", onclick: () => confirm(`Delete "${d.title}"? This can't be undone.`) && act(`/api/loops/${id}`, "DELETE") }, "Delete")));
}

async function act(path, method, body) {
  try { await api(path, { method, body: body && JSON.stringify(body) }); }
  catch (e) { alert(e.message); }
  await refresh();
}

// --- chat ---
function addMessage(cls, ...content) {
  $("hello")?.remove();
  const el = h("div", { class: "msg " + cls }, ...content);
  $("messages").append(el);
  el.scrollIntoView({ block: "end" });
  return el;
}
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; }

// Sends `text` to Hermes and shows `shown` as the user's message. `copy` adds a Copy button to the reply (drafts).
async function send(text, shown = text, copy = false) {
  $("send").disabled = true;
  addMessage("user", shown);
  const typing = h("div", { class: "typing", "aria-label": "Continuum is thinking" }, h("span"), h("span"), h("span"));
  $("messages").append(typing); typing.scrollIntoView({ block: "end" });
  try {
    const { reply } = await api("/api/chat", { method: "POST", body: JSON.stringify({ message: text, conversation }) });
    const msg = addMessage("bot", reply || "(no reply)");
    if (copy && reply) msg.append(h("button", { class: "btn small copy", type: "button", onclick: (e) => copyText(reply, e.currentTarget) }, "Copy"));
  } catch (err) {
    addMessage("error", h("strong", {}, "Couldn't reach Continuum. "), err.message);
  } finally {
    typing.remove();
    $("send").disabled = false;
    $("input").focus();
  }
  highlightNext = true;
  refresh();
}

async function copyText(text, button) {
  try { await navigator.clipboard.writeText(text); button.textContent = "Copied"; }
  catch (e) { button.textContent = `Copy failed: ${e.message}`; }
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = ""; autosize();
  send(text);
});
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("show-resolved").addEventListener("change", loadLoops);
$("show-snoozed").addEventListener("change", loadLoops);
refresh();
</script>
